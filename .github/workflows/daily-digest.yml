name: Daily Health Social Digest

on:
  schedule:
    # 11:00 UTC = 7:00 AM Eastern (during daylight saving)
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bluesky blocks GitHub's servers (403). Patch digest.py at runtime
      # so we don't depend on manually editing digest.py on GitHub.
      - name: Skip Bluesky (blocked from cloud servers)
        run: |
          python3 << 'EOF'
          from pathlib import Path
          path = Path("digest.py")
          text = path.read_text()
          text = text.replace(
              "bluesky_items = fetch_bluesky_items(config, pattern)",
              "bluesky_items = []  # Bluesky skipped — blocked from GitHub servers",
          )
          path.write_text(text)
          print("Patched digest.py to skip Bluesky")
          EOF

      - name: Run digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REDDIT_RSS_USER: ${{ secrets.REDDIT_RSS_USER }}
          REDDIT_RSS_FEED: ${{ secrets.REDDIT_RSS_FEED }}
        run: python digest.py
